<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardenscapes Panelim</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .active {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gardenscapes Save Tool v1.0</h1>
        <div class="user-info">
            <span>Sait_ayd</span>
            <button id="logoutBtn" style="width: auto; padding: 5px 10px;">Logout</button>
        </div>
        
        <h2>Dashboard</h2>
        <div class="card">
            <p><strong>Username:</strong> Sait_ayd</p>
            <p><strong>Status:</strong> <span class="active">Active</span></p>
        </div>

        <h2>Save Düzenleme</h2>
        <div class="card">
            <label>Altın Miktarı:</label>
            <input type="number" id="goldInput" placeholder="Örn: 999999">
            
            <label>Yıldız Miktarı:</label>
            <input type="number" id="starInput" placeholder="Örn: 5000">
            
            <button id="applyBtn">Değerleri Uygula</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
